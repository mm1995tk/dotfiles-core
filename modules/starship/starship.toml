# https://starship.rs/ja-JP/config/
"$schema" = 'https://starship.rs/config-schema.json'

format = """\
$time\
$line_break\
$username\
$hostname\
$localip\
$shlvl\
$singularity\
$kubernetes\
$directory\
$vcsh\
$fossil_branch\
$fossil_metrics\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$hg_branch\
$pijul_channel\
$docker_context\
$package\
$c\
$cmake\
$cobol\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$golang\
$guix_shell\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$gradle\
$lua\
$nim\
$nodejs\
$ocaml\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$quarto\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$typst\
$vlang\
$vagrant\
$zig\
$buf\
$nix_shell\
$conda\
$meson\
$spack\
$memory_usage\
$aws\
$gcloud\
$openstack\
$azure\
$direnv\
$env_var\
$crystal\
$custom\
$sudo\
$cmd_duration\
$line_break\
$jobs\
$battery\
$status\
$os\
$container\
$shell\
$character\
"""

palette = "rose_pine_moon"

# Rosé Pine Moon 公式のターミナル用マッピング。
# 色名を上書きすることで、ターミナル側のテーマに依存せず同じ見た目になる。
# Rosé Pine には緑が無く、green には pine（青緑）が割り当てられる。
[palettes.rose_pine_moon]
bg = "#232136"
fg = "#e0def4"
cursor = "#e0def4"
cursor_text = "#232136"
selection = "#44415a"

black = "#393552"
red = "#eb6f92"
green = "#3e8fb0"
yellow = "#f6c177"
blue = "#9ccfd8"
# starship の組み込み色名は "purple"。"magenta" も同値で定義しておく。
purple = "#c4a7e7"
magenta = "#c4a7e7"
cyan = "#ea9a97"
white = "#e0def4"

bright-black = "#6e6a86"
bright-red = "#eb6f92"
bright-green = "#3e8fb0"
bright-yellow = "#f6c177"
bright-blue = "#9ccfd8"
bright-purple = "#c4a7e7"
bright-magenta = "#c4a7e7"
bright-cyan = "#ea9a97"
bright-white = "#e0def4"

[status]
disabled = false

[time]
format = "[$time]($style)"
disabled = false
time_format = "%FT%T%:z"

[directory]
style = "bold blue"

[git_commit]
only_detached = false
