$azure\
$direnv\
$crystal\
$custom\
$sudo\
$line_break\
$jobs\
$battery\
$os\
$container\
$shell\
$character\
"""


# ここの値は default.nix が既定値として渡すので、使う側は lib.mkForce なしで上書きできる。

# 16 色の実体は端末（ghostty / kitty のテーマ）が持つ。ここでは色名だけを使い、hex は
# 書かない。starship の palette は使わない（端末と二重に色を持つことになるため）。

# どのプロファイルで switch した環境かをプロンプト先頭に出す。
# DOTFILES_PROFILE と style は使う側がプロファイルごとに入れる。未設定ならモジュールごと非表示になる。
[env_var.DOTFILES_PROFILE]
format = " [@$env_value]($style)"
style = "bold purple"

# 時刻・所要時間・終了コードはプロンプトに出さず、コマンドの前後に zsh が出す（modules/zsh/index.zsh）。
# プロンプトの時刻は前のコマンドが終わった時刻で、次のコマンドを入力した時刻ではないため。
[username]
show_always = true
format = "[$user]($style)"

[directory]
style = "bold blue"

[git_commit]
only_detached = false
